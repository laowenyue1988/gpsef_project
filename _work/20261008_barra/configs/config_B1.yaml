  baseline_index_code: csi800
  risk_aversion: 0.5
  max_weight: 0.1
  lambda_dev: 0.2
  lambda_l2: 0.3
  lambda_ind: 0.3
  expected_ic: 0.05
  alpha_scale: 10.0
  vol_target: 0.15
  risk_budget:
    mode: risk_budget
    factors:
    - volatility
    - beta
    strength: 0.3
    exclude_quantile: 0.0
    min_coverage: 0.8
    shuffle_seed: null
    snapshot_dir: null
experiment: {}
