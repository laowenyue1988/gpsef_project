  enabled: false
  method: ipbs_soft_rerank
  extended_pool_size: 30
  ipbs_lambda: 0.15
  cpr_window: 5
  vwap_window: 5
  distr_volume_threshold: 1.2
  distr_volume_ma_window: 20
  ipbs_exit_enabled: true
  ipbs_exit_cpr_threshold: 0.3
  ipbs_exit_distr_threshold: 0.7
  ipbs_exit_vwap_threshold: -0.01
garch_control:
  enabled: false
  vol_target: 0.24
  lookback: 250
  vol_method: garch
  vol_model: EGARCH
  ewma_lambda: 0.94
  min_scale: 0.15
  max_scale: 1.0
  drawdown_limit: 0.2
  use_drawdown_control: false
  dd_function: concave
  use_recovery_buffer: false
  recovery_buffer_periods: 3
  garch_dist: t
  use_ewma_cross_check: false
  secondary_dd_threshold: 0.15
  secondary_dd_floor: 0.5
  tertiary_dd_threshold: 0.2
  tertiary_dd_floor: 0.25
  use_kill_switch: false
  kill_switch_threshold: 0.3
  kill_switch_floor: 0.0
  kill_switch_lock_periods: 5
  use_adf_test: true
  adf_pvalue_threshold: 0.05
  use_arch_lm_test: true
  arch_lm_pvalue_threshold: 0.05
  use_winsorize: false
  winsorize_lower: 0.005
  winsorize_upper: 0.995
  use_daily_scale: true
  exposure_band: 0.05
