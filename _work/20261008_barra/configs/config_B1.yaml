logging:
  numba_level: WARNING
strategy:
  name: SmallAlpha191Test3
  class: strategies.small_alpha191.strategy.SmallAlpha191Strategy
backtest:
  start_date: '20240401'
  end_date: '20240801'
  initial_cash: 1000000.0
  benchmark_code: sh.000300
data:
  base_path: ./data
  reference_date: auto
  factor_snapshot_dir: factor_snapshots_test
  recomd_snapshot_dir: ./data/wyckoff20_v10_recomd_snapshots
  v10_gate_enabled: false
  v10_gate_max_defer_days: 0
  smallcap_pool_size: 300
  pool_cache_tag: o3_20260910
  stock_pool:
    type: dynamic
    filters:
    - st
    - new_stock
    - price_min:3
    - amount_pct:0.1
execution:
  commission_rate: 0.0003
  tax_rate: 0.0005
  min_commission: 5.0
  slippage: 0.001
  transfer_fee_rate: 1.0e-05
  max_positions: 20
  max_position_pct: 0.1
index_code: all
risk_index_code: sh932000
rebalance_interval: 20
rebalance_batches: 1
retrain_interval: 1
train_window_days: 240
auc_threshold: 0.53
ic_gate_threshold: 0.02
cv_folds: 5
cv_embargo_days: 21
cv_feature_consensus: 1
cv_ic_psi_split_ratio: 0.5
psi_threshold: 0.15
min_feat_ic: 0.001
ic_mode: daily
nan_threshold: 0.4
max_corr: 0.85
min_features: 10
max_features: 150
hyperparam_search:
  enabled: true
  inner_val_days: 20
  eval_windows: 3
  early_stopping_rounds: 20
  eval_rounds: 600
  use_early_stop: true
  candidates:
  - name: c1_conservative
    xgb_max_depth: 3
    xgb_n_estimators: 300
    xgb_learning_rate: 0.05
    xgb_subsample: 0.6
    xgb_col_sample_by_tree: 0.6
    xgb_reg_alpha: 0.5
    xgb_reg_lambda: 3.0
    xgb_min_child_weight: 30
    xgb_gamma: 0.1
  - name: c2_baseline_s
    xgb_max_depth: 4
    xgb_n_estimators: 400
    xgb_learning_rate: 0.03
    xgb_subsample: 0.6
    xgb_col_sample_by_tree: 0.7
    xgb_reg_alpha: 0.5
    xgb_reg_lambda: 2.0
    xgb_min_child_weight: 25
    xgb_gamma: 0.0
  - name: c3_balanced
    xgb_max_depth: 5
    xgb_n_estimators: 500
    xgb_learning_rate: 0.025
    xgb_subsample: 0.7
    xgb_col_sample_by_tree: 0.7
    xgb_reg_alpha: 0.3
    xgb_reg_lambda: 1.5
    xgb_min_child_weight: 20
    xgb_gamma: 0.05
  - name: c4_strong
    xgb_max_depth: 6
    xgb_n_estimators: 600
    xgb_learning_rate: 0.02
    xgb_subsample: 0.7
    xgb_col_sample_by_tree: 0.8
    xgb_reg_alpha: 0.2
    xgb_reg_lambda: 1.0
    xgb_min_child_weight: 15
    xgb_gamma: 0.0
feature_selection:
  use_voting: true
  mda:
    enabled: true
    n_repeats: 20
    threshold: 0.0
    use_std_threshold: true
    t_alpha: 0.05
    inner_oos_frac: 0.15
    inner_oos_min_days: 20
  voting:
    vote_min_folds: 3
    vote_min_features: 5
    top_k_features: 40
    weight_ic: 0.0
    weight_mdi: 0.3
    weight_mda: 1.5
    fallback_to_ic_only: true
  feature_clustering:
    enabled: true
    cfi_mode: false
    legacy_threshold: false
    diagnose: true
    method: hierarchical
    corr_threshold: 0.7
    corr_method: spearman
    repr_method: sfi
    min_cluster_size: 2
    log_clusters: true
xgb_n_estimators: 400
xgb_max_depth: 4
xgb_learning_rate: 0.03
xgb_subsample: 0.6
xgb_col_sample_by_tree: 0.7
xgb_reg_alpha: 0.5
xgb_reg_lambda: 2.0
xgb_min_child_weight: 25
xgb_gamma: 0.0
xgb_random_state: 42
xgb_early_stopping_rounds: 20
xgb_eval_metric: auc
xgb_tree_method: hist
xgb_device: cpu
ensemble_seeds:
- 42
- 43
- 44
- 45
- 46
lightgbm:
  enabled: false
  ensemble_weight_xgb: 1.0
  ensemble_weight_lgb: 0.0
  params:
    objective: binary
    metric: auc
    boosting_type: gbdt
    num_leaves: 15
    learning_rate: 0.03
    feature_fraction: 0.7
    bagging_fraction: 0.6
    bagging_freq: 5
    min_data_in_leaf: 80
    lambda_l1: 0.5
    lambda_l2: 2.0
    max_depth: 4
    num_threads: 2
    verbose: -1
xgb_class_balance: auto
alpha191_score:
  enabled: true
  tanh_amplitude: 0.4
  tanh_k: 3.0
  oversold_threshold: 0.2
  overbought_threshold: 0.8
meta_labeling:
  enabled: true
  candidate_pool_size: 300
  pt_mult: 6.3
  sl_mult: 4.7
  max_hold_days: 20
  minute_freq: '5'
  daily_vol_window: 20
  vol_multiplier: 1.0
  vol_method: ewma
  vol_ewma_lambda: 0.94
  vol_ewma_seed_days: 60
  max_meta_selected: 20
  prob_temperature: 0.5
  auc_gate_enabled: true
  label_mode: staged_rank
  label_entry_align: next_day_open
  label_min_abs_ret: 0.0
  calibration_method: platt
  sample_weight_pt_sl_multiplier: 2.0
staged_exit:
  enabled: true
  stage1:
    pt_sigma: 4.5
    sl_sigma: -1.8
    sell_pct: 0.25
  stage2:
    pt_sigma: 4.5
    sl_sigma: -1.8
    sell_pct: 0.35
  stage3:
    pt_sigma: 6.0
    sl_sigma: -2.4
    sell_pct: 0.2
  stage4:
    pt_sigma: 9.0
    sl_sigma: -2.4
    sell_pct: 0.2
  hard_sl_sigma: -6.0
  profit_lock:
    s1_sl: 0.0
    s2_sl: 1.0
    s3_sl: 2.0
  pt_after_sl:
    s2_pt: 1.5
    s3_pt: 2.0
  reinvest_enabled: false
  reinvest_min_amount: 5000
  profit_protect:
    enabled: false
    trigger_sigma: 1.0
    sl_sigma: 0.0
drawdown_breaker:
  enabled: false
  dd_half: 0.1
  dd_flat: 0.15
  dd_recover_full: 0.05
  trend_confirm_days: 3
  index_code: sh000001
  index_ma: 20
rebalance_trend_gate:
  enabled: false
  index_code: sh000001
  ma: 10
  auc_threshold_up: 0.52
  auc_threshold_dn: 0.54
  scale_up_ok: 1.0
  scale_up_bad: 0.5
  scale_dn_ok: 0.5
  scale_dn_bad: 0.0
ffd:
  enabled: true
neutralization:
  enabled: true
  use_market_cap: true
  use_industry: true
  exclude_prod_val_in_fit: true
AUTO_STAGE_CONFIG:
  1:
    n_trials: 2
    n_jobs: 1
  2:
    n_trials: 2
    n_jobs: 1
  3:
    n_trials: 2
    n_jobs: 1
  4:
    n_trials: 2
    n_jobs: 1
  5:
    n_trials: 2
    n_jobs: 1
