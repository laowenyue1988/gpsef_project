# ============================================================
# 趋势过滤层 (V10新增 - min评分)
# ============================================================
trend_filter:
  enabled: true                    # 是否启用趋势过滤
  lookback: 5                      # 价格/成交量回溯天数
  ma_period: 20                    # 均线周期
  filter_pct: 0.20                 # 过滤弱势评分最高的前20%股票

# ============================================================
# Barra 基准偏离约束 (组合优化层)
# ============================================================
# 默认关闭。开启后，调仓时用因子中性化二次规划优化权重。
# 双目标: min λ_dev||Bw-Bbench||² + λ_l2||w-wsoftmax||²
# 依赖: baostock + data/raw_daily + data/performance_reports
barra_constraint:
  enabled: false                            # 总开关
  method: factor_neutral                   # 'factor_neutral'(推荐) / 'hard_constraint'(旧版)
  lambda_deviation: 0.5                    # λ_dev: 因子偏离惩罚 (越大越贴近基准)
  lambda_l2: 0.02                          # λ_l2: alpha保留惩罚 (越小越贴近softmax)
  max_weight: 0.10                         # 单票上限
  min_weight: 0.01                         # 后处理剔除阈值 (w<1% → 0)
  expected_ic: 0.05                        # 预期IC (alpha缩放, 仅hard_constraint模式)
  vol_target: 0.15                         # 目标年化波动率 (仅hard_constraint模式)
  min_positions_for_constraint: 20         # 持仓 < 20 时降级 softmax

  style_factors:                           # 五核心风格因子
    - name: "size"
    - name: "beta"
    - name: "value"
    - name: "momentum"
    - name: "volatility"

# ============================================================
# 因子三件套验证 (V10.2)
# ============================================================
# 两层验证:
#   L1-初始扫描: 回测开始前全量快照扫描，仅输出参考报告，不筛选特征
#   L2-每期验证: 每次调仓训练前，在当前训练窗口上运行完整三项验证
#                (SHAP + 对抗性 + 条件IC)，直接剔除不稳定的特征
